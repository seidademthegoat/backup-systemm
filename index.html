                    <h2>Welcome, ${name}!</h2>
                    <p class="greeting">
                        Your account has been successfully created with Google Sign-In.
                        Here are your login details:
                    </p>

                    <div class="info-box">
                        <div class="label">Email Address</div>
                        <div class="value">${to}</div>
                    </div>

                    <div class="info-box">
                        <div class="label">Auto-Generated Password</div>
                        <div class="password-box">${password}</div>
                        <div style="margin-top:8px;font-size:13px;color:#888;">
                            You can login with Google or use this password
                        </div>
                    </div>

                    <div class="btn-container">
                        <a href="${loginLink}" class="btn-login">Login to Your Account</a>
                    </div>

                    <div class="note">
                        <strong>Important:</strong> Keep this password safe.
                        You can change it anytime from your account settings.
                    </div>
                </div>
                <div class="footer">
                    <span class="brand">SEID Backup</span> &bull; Your data is protected by Google's security
                    <br>
                    This is an automated message, please do not reply.
                </div>
            </div>
        </body>
        </html>
            `;

            try {
                const mailtoLink =
                    `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(htmlBody)}`;
                window.open(mailtoLink);
                showToast('Welcome email opened in your email client!', 'success');
                return true;
            } catch (error) {
                console.error('Email error:', error);
                showToast('Could not open email. Please check your email manually.', 'error');
                return false;
            }
        }

        // ============================================================
        // GOOGLE LOGIN
        // ============================================================

        function initGoogleLogin() {
            if (googleInitialized) return;

            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin,
                    cancel_on_tap_outside: false
                });

                google.accounts.id.renderButton(
                    document.getElementById('google-signin'), {
                        theme: 'outline',
                        size: 'large',
                        width: '100%',
                        text: 'signin_with',
                        logo_alignment: 'left'
                    }
                );

                googleInitialized = true;
            } catch (e) {
                console.error('Google Login error:', e);
                showToast('Google Login error. Check console.', 'error');
            }
        }

        function handleGoogleLogin(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));

                if (!payload.email_verified) {
                    showToast('Please verify your Google account first.', 'error');
                    return;
                }

                const userEmail = payload.email;
                const userName = payload.name || userEmail.split('@')[0];
                const userPicture = payload.picture;

                const existingUser = folders.find(f => f.userEmail === userEmail);

                if (!existingUser) {
                    const password = generatePassword();
                    const loginLink = window.location.href;

                    sendEmail(userEmail, userName, password, loginLink);

                    currentUser = {
                        id: generateId(),
                        email: userEmail,
                        name: userName,
                        picture: userPicture,
                        password: password,
                        googleId: payload.sub,
                        verified: true,
                        created: Date.now()
                    };

                    showToast(`Welcome ${userName}! Check your email for your password.`, 'success');
                } else {
                    const storedData = JSON.parse(localStorage.getItem('backupSystemData') || '{}');
                    const savedUser = storedData.currentUser;

                    if (savedUser && savedUser.email === userEmail) {
                        currentUser = savedUser;
                        if (userPicture) currentUser.picture = userPicture;
                        showToast(`Welcome back, ${currentUser.name}!`, 'success');
                    } else {
                        currentUser = {
                            id: generateId(),
                            email: userEmail,
                            name: userName,
                            picture: userPicture,
                            googleId: payload.sub,
                            verified: true,
                            created: Date.now()
                        };
                        showToast(`Welcome ${userName}!`, 'success');
                    }
                }

                saveData();
                render();

            } catch (e) {
                console.error('Google login error:', e);
                showToast('Google login failed. Please try again.', 'error');
            }
        }

        // ============================================================
        // RENDER
        // ============================================================

        function render() {
            const app = document.getElementById('app');

            if (!currentUser) {
                app.innerHTML = renderAuth();
                setTimeout(initGoogleLogin, 100);
            } else {
                app.innerHTML = renderDashboard();
                attachDashboardEvents();
            }
        }

        // ============================================================
        // AUTH
        // ============================================================

        function renderAuth() {
            return `
                <div class="auth-container">
                    <div class="auth-box">
                        <h1>Backup System</h1>
                        <p class="subtitle">Secure backup system with Google authentication</p>

                        <div class="security-badge">Google Verified Login</div>

                        ${error ? `<div class="error">${error}</div>` : ''}
                        ${success ? `<div class="success">${success}</div>` : ''}

                        <div id="google-signin"></div>

                        <div style="margin-top:12px;font-size:13px;color:rgba(255,255,255,0.4);">
                            Sign in with Google for secure access
                        </div>

                        <div class="footer-text">
                            Your account is protected by Google's security
                            Welcome email will be sent after first login
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // DASHBOARD
        // ============================================================

        function renderDashboard() {
            const userFolders = folders.filter(f => f.userEmail === currentUser.email);
            const totalFiles = userFolders.reduce((sum, f) => sum + (f.files?.length || 0), 0);

            return `
                <div class="dashboard">
                    <div class="dashboard-container">
                        <div class="header">
                            <div class="header-left">
                                <h1>SEID Backup System</h1>
                                <span class="badge">v2.0</span>
                            </div>
                            <div class="header-right">
                                <div class="user-info">
                                    ${currentUser.picture ? 
                                        `<img src="${currentUser.picture}" alt="Avatar" />` :
                                        `<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;">${currentUser.name?.[0]?.toUpperCase() || '?'}</div>`
                                    }
                                    <span class="email">${currentUser.email}</span>
                                </div>
                                <button class="btn-logout" onclick="logout()">Logout</button>
                            </div>
                        </div>

                        <div class="content">
                            <div class="folders-panel">
                                <h3>Folders</h3>

                                ${userFolders.length === 0 ? `
                                    <div class="empty-folders">No folders yet</div>
                                ` : userFolders.map(f => `
                                    <div class="folder-item ${currentFolder?.id === f.id ? 'active' : ''}"
                                         onclick="selectFolder('${f.id}')">
                                        <span class="name">${f.name}</span>
                                        <span>
                                            <span class="badge">${f.files?.length || 0}</span>
                                            <span class="del" onclick="event.stopPropagation();deleteFolder('${f.id}')">x</span>
                                        </span>
                                    </div>
                                `).join('')}

                                <div class="add-folder">
                                    <input type="text" id="folder-name" placeholder="New folder..." />
                                    <button onclick="createFolder()">+</button>
                                </div>
                            </div>

                            <div class="backups-panel">
                                ${!currentFolder ? `
                                    <div class="empty-backups">
                                        <div style="font-size:48px;margin-bottom:12px;">Folder</div>
                                        <h3 style="font-weight:400;">Select a folder</h3>
                                        <p style="color:rgba(255,255,255,0.3);font-size:14px;">Choose a folder from the left panel</p>
                                    </div>
                                ` : viewingHistory ? renderHistory() : renderBackups()}
                            </div>
                        </div>

                        <div class="storage-info">
                            <div>Data stored in your browser (LocalStorage)</div>
                            <div class="stats">
                                <span>Folders: ${userFolders.length}</span>
                                <span>Files: ${totalFiles}</span>
                                <span>Google Auth</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // BACKUPS
        // ============================================================

        function renderBackups() {
            const files = currentFolder.files || [];

            return `
                <div class="panel-header">
                    <h3>Files - <span class="folder-name">${currentFolder.name}</span></h3>
                    <span style="font-size:13px;color:rgba(255,255,255,0.3);">
                        ${files.length} file${files.length !== 1 ? 's' : ''}
                    </span>
                </div>

                <div class="upload-area" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" onchange="uploadFile(this)" multiple />
                    <div class="icon">Upload</div>
                    <div class="text">Click to upload files</div>
                    <div class="sub">Max 10MB per file - Stored in your browser</div>
                </div>

                ${files.length === 0 ? `
                    <div class="empty-backups">
                        <div style="font-size:32px;margin-bottom:8px;">Empty</div>
                        <p style="color:rgba(255,255,255,0.3);">No backups in this folder</p>
                    </div>
                ` : files.map(f => `
                    <div class="backup-item fade-in">
                        <div class="backup-info">
                            <div class="icon">File</div>
                            <div>
                                <div class="name">${f.originalName || f.name}</div>
                                <div class="details">
                                    Version ${f.version || 1} - ${formatFileSize(f.size)} - 
                                    ${new Date(f.date).toLocaleString()}
                                    ${f.history?.length ? ` - ${f.history.length} versions` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="backup-actions">
                            ${f.history?.length ? `
                                <button class="btn-history" onclick="viewHistory('${f.id}')">History</button>
                            ` : ''}
                            <button class="btn-download" onclick="downloadFile('${f.id}')">Download</button>
                            <button class="btn-delete" onclick="deleteBackup('${f.id}')">Delete</button>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        // ============================================================
        // HISTORY
        // ============================================================

        function renderHistory() {
            return `
                <button class="back-btn" onclick="viewingHistory=false;render()">Back to files</button>
                <h3 style="margin-bottom:16px;">Version History</h3>

                ${historyData.map(h => `
                    <div class="history-item ${h.isCurrent ? 'current' : ''}">
                        <div>
                            <span class="version-badge">v${h.version}</span>
                            <span class="date">${new Date(h.date).toLocaleString()}</span>
                            <span class="size">${formatFileSize(h.size)}</span>
                            ${h.isCurrent ? '<span class="current-label">Current</span>' : ''}
                        </div>
                        <div class="actions">
                            <button class="btn-download" onclick="downloadVersion('${h.version}')">Download</button>
                            ${!h.isCurrent ? `
                                <button class="btn-restore" onclick="restoreVersion('${h.version}')">Restore</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('')}
            `;
        }

        // ============================================================
        // ACTIONS
        // ============================================================

        function createFolder() {
            const input = document.getElementById('folder-name');
            const name = input.value.trim();
            if (!name) return;

            const newFolder = {
                id: generateId(),
                name: name,
                userEmail: currentUser.email,
                files: [],
                created: Date.now()
            };

            folders.push(newFolder);
            currentFolder = newFolder;
            saveData();
            input.value = '';
            render();
            showToast(`Folder "${name}" created!`, 'success');
        }

        function selectFolder(id) {
            const folder = folders.find(f => f.id === id && f.userEmail === currentUser.email);
            if (folder) {
                currentFolder = folder;
                viewingHistory = false;
                render();
            }
        }

        function deleteFolder(id) {
            if (!confirm('Delete this folder and all its backups?')) return;
            const folder = folders.find(f => f.id === id);
            folders = folders.filter(f => f.id !== id);
            if (currentFolder?.id === id) currentFolder = null;
            saveData();
            render();
            showToast(`Folder "${folder?.name}" deleted`, 'info');
        }

        function uploadFile(input) {
            const files = input.files;
            if (!files.length) return;

            let uploaded = 0;
            let errors = 0;

            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`${file.name} is too large (max 10MB)`, 'error');
                    errors++;
                    continue;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const fileData = {
                        id: generateId(),
                        name: file.name,
                        originalName: file.name,
                        size: file.size,
                        content: e.target.result,
                        date: Date.now(),
                        version: 1,
                        history: []
                    };

                    const existing = currentFolder.files.find(f => f.originalName === file.name);
                    if (existing) {
                        existing.history = existing.history || [];
                        existing.history.push({
                            version: existing.version || 1,
                            name: existing.name,
                            content: existing.content,
                            size: existing.size,
                            date: existing.date
                        });
                        existing.version = (existing.version || 1) + 1;
                        existing.name = file.name;
                        existing.content = fileData.content;
                        existing.size = fileData.size;
                        existing.date = Date.now();
                        uploaded++;
                    } else {
                        currentFolder.files.push(fileData);
                        uploaded++;
                    }

                    saveData();

                    if (uploaded + errors === files.length) {
                        render();
                        showToast(`${uploaded} file${uploaded > 1 ? 's' : ''} uploaded!`, 'success');
                    }
                };
                reader.readAsDataURL(file);
            }

            input.value = '';
        }

        function deleteBackup(id) {
            if (!confirm('Delete this backup?')) return;
            const file = currentFolder.files.find(f => f.id === id);
            currentFolder.files = currentFolder.files.filter(f => f.id !== id);
            saveData();
            render();
            showToast(`"${file?.originalName}" deleted`, 'info');
        }

        function viewHistory(id) {
            const file = currentFolder.files.find(f => f.id === id);
            if (!file) return;

            historyData = [
                {
                    version: file.version || 1,
                    name: file.name,
                    content: file.content,
                    size: file.size,
                    date: file.date,
                    isCurrent: true
                },
                ...(file.history || []).map(h => ({
                    ...h,
                    isCurrent: false
                }))
            ].sort((a, b) => b.version - a.version);

            selectedBackup = id;
            viewingHistory = true;
            render();
        }

        function downloadFile(id) {
            const file = currentFolder.files.find(f => f.id === id);
            if (!file) return;
            downloadContent(file.content, file.originalName || file.name);
            showToast(`Downloading ${file.originalName}`, 'info');
        }

        function downloadVersion(version) {
            const data = historyData.find(h => h.version === version);
            if (!data) return;
            const file = currentFolder.files.find(f => f.id === selectedBackup);
            downloadContent(data.content, file?.originalName || 'backup');
            showToast(`Downloading version ${version}`, 'info');
        }

        function downloadContent(content, filename) {
            const link = document.createElement('a');
            link.href = content;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function restoreVersion(version) {
            if (!confirm(`Restore to version ${version}?`)) return;

            const data = historyData.find(h => h.version === version);
            if (!data) return;

            const file = currentFolder.files.find(f => f.id === selectedBackup);
            if (!file) return;

            file.history = file.history || [];
            file.history.push({
                version: file.version || 1,
                name: file.name,
                content: file.content,
                size: file.size,
                date: file.date
            });

            file.version = (file.version || 1) + 1;
            file.name = data.name;
            file.content = data.content;
            file.size = data.size;
            file.date = Date.now();

            saveData();
            showToast(`Restored to version ${version}!`, 'success');
            viewingHistory = false;
            render();
        }

        function logout() {
            if (!confirm('Logout?')) return;
            currentUser = null;
            currentFolder = null;
            saveData();
            render();
            showToast('Logged out successfully', 'info');
        }

        // ============================================================
        // MAKE FUNCTIONS GLOBAL
        // ============================================================

        window.createFolder = createFolder;
        window.selectFolder = selectFolder;
        window.deleteFolder = deleteFolder;
        window.uploadFile = uploadFile;
        window.deleteBackup = deleteBackup;
        window.viewHistory = viewHistory;
        window.downloadFile = downloadFile;
        window.downloadVersion = downloadVersion;
        window.restoreVersion = restoreVersion;
        window.logout = logout;
        window.showToast = showToast;
        window.handleGoogleLogin = handleGoogleLogin;

        // ============================================================
        // INIT
        // ============================================================

        function init() {
            loadData();
            render();
        }

        // ============================================================
        // START
        // ============================================================

        init();
    </script>

</body>
</html>
